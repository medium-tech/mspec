lingo:
    spec: 'exe'
    version: '0.1.0b'

meta:
    description: 'Hello world for user input params (bool, int, str).'

params:
    color:
        define: str
        default: 'red'
        enum:
          - red
          - green
          - blue
    
    friend:
        define: 'hello_ns.person'

    list_of_friends:
        define: list
        element_type: 'hello_ns.person'

main:
    join:
        separator: '\n'
        items:
            - concat:
                - 'color: '
                - str:
                    get: params.color

            - concat:
                - "friend's name: "
                - get: params.friend.name

            - concat:
                - 'total fiends: '
                - str:
                    list:
                        get: params.list_of_friends
