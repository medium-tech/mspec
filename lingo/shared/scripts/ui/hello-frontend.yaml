lingo:
    spec: 'ui'
    version: '0.1.0b'

backend: 'hello-backend.yaml'

meta:
    description: 'Hello world for a frontend application.'
    development_notes: |
        Note that in the widget.model or widget.op field we reference the path via the 
        backend path (my_app.<name>) even though it's available at hello_ns.person
        as well. Using the backend path is required because that path is how to derive
        the url endpoint.

state:
    say_hello:
        define: 'lingo.op_call'

    create_person:
        define: 'lingo.model_create'
    
    view_people: 'lingo.model_list'

ops: {}

output:
    - heading: 'Say Hello'
    - widget:
        bind: 'say_hello'
        op: 'my_app.say_hello'
        
    - heading: 'Create Person'
    - widget:
        bind: 'create_person'
        model: 'my_app.person'
        display: 'create'

    - heading: 'View People'
    - widget:
        model: 'my_app.person'
        display: 'list'