lingo:
    spec: 'gui'
    version: '0.1.0b'

backend: 'hello-backend.yaml'

meta:
    description: 'Hello world for a frontend application.'
    development_notes: |
        Note that in the widget.model or widget.op field we reference the path via the 
        backend path (my_app.<name>) even though it's available at hello_ns.person
        as well. Using the backend path is required because that path is how to derive
        the url endpoint.

params:
    person_id:
        define: str
        description: 'The ID of the person to view.'
        default: '-1'

state:
    say_hello:
        define: 'lingo.op_call'

    create_person:
        define: 'lingo.model_create'
    
    view_people: 'lingo.model_list'

block:
    - heading: 'App Ops'

    - heading: 'Say Hello'
      level: 2
    - widget:
        bind: 'say_hello'
        op: 'my_app.say_hello'

    - heading: 'App Models'

    - heading: 'View Person'
      level: 2
    - widget:
        model: 'my_app.person'
        display: 'view'
        model_id: 
            params: person_id

    - heading: 'Create Person'
      level: 2
    - widget:
        bind: 'create_person'
        model: 'my_app.person'
        display: 'create'

    - heading: 'Person List'
      level: 2
    - widget:
        model: 'my_app.person'
        display: 'list'
    
