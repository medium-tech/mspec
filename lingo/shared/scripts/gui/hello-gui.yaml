lingo:
    spec: 'gui'
    version: '0.1.0b'

state:
    counter:
        description: 'The current count value, default is 3 because its less ambiguous than O/O/o for OCR tests'
        define: int
        default: 3

ops:
    increment_counter:
        description: 'Increment the counter by 1 and return the new value.'

        return:
            description: 'The new counter value after incrementing.'
            define: int

        func:
            set: 'state.counter'
            to:
                add:
                    a:
                        get: state.counter
                    b: 1

block:
    - button:
        call: 'ops.increment_counter'
        text: 'increment count'
    - 'total count: '
    - text:
        get: state.counter
