lingo:
    spec: 'gui'
    version: '0.1.0b'

state:
    counter:
        description: 'The current count value.'
        define: int
        default: 0

ops:
    increment_counter:
        description: 'Increment the counter by 1.'

        return:
            description: 'The new counter value after incrementing.'
            define: int

        func:
            set: 'state.counter'
            to:
                add:
                    a:
                        get: state.counter
                    b: 1

block:
    - button:
        call: 'increment_counter'
        text: 'increment count'
    - 'total count: '
    - text:
        get: state.counter
