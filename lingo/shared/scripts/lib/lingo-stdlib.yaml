lingo:
    spec: 'lib'
    version: '0.1.0b'

modules:

    lingo:
        form:
            define: struct
            fields:
                status:
                    define: str
                    default: 'initial'
                    enum: 
                    - initial
                    - loading
                    - success
                    - error
                
                enabled:
                    define: bool
                    default: true
                    
                form_data:
                    define: struct      # current form values

                initial_form_data:
                    define: struct      # initial form values   (optional)

                form_errors:            # form errors by field  (optional)
                    define: struct
        
        model_list:
            define: struct
            fields:
                status:
                    define: str
                    default: 'initial'
                    enum:
                    - initial
                    - loading
                    - success
                    - error

                offset:
                    define: int
                    default: 0

                size:
                    define: int
                    default: 10

                total:
                    define: int
                    default: -1
