lingo:
    spec: 'lib'
    version: '0.1.0b'

modules:

    lingo:
        op_call:
            define: struct
            fields:
                status:
                    define: str
                    default: 'initial'
                form:
                    define: struct
                    # default:
                    #     unknown: 'Form fields will be supplied by the widget.'
                form_errors:
                    define: struct
                    # default:
                    #     unknown: 'Form errors will be supplied by the widget.'
                result:
                    define: any
                    # default:
                    #     unknown: 'Result will be supplied by the widget.'

        model_create:
            define: struct
            fields:
                status:
                    define: str
                    default: 'initial'
                form:
                    define: struct
                    # default:
                    #     unknown: 'Form fields will be supplied by the widget.'
                form_errors:
                    define: struct
                    # default:
                    #     unknown: 'Form errors will be supplied by the widget.'
                result:
                    define: any
                    # default:
                    #     unknown: 'Result will be supplied by the widget.'
        
        model_list:
            define: struct
            fields:
                status:
                    define: str
                    default: 'initial'
                offset:
                    define: int
                    default: 0
                size:
                    define: int
                    default: 10
                total:
                    define: int
                    # default:
                    #     unknown: 'Total will be known after the list is retrieved.'
                result:
                    define: list
                    # default:
                    #     unknown: 'List will be known after the list is retrieved.'