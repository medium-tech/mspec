lingo:
    spec: 'text'
    version: '0.1.0b'

block:
    - heading: 'Text Styles and Colors'
      level: 1

    - heading: 'Decorations'
      level: 2

    - text: 'aardvark '
      style: 
        bold: true

    - text: 'elephant '
      style:
        italic: true
    - text: 'volcano '
      style:
        underline: true

    - break: 1

    - text: 'thistle and whistle '
      style:
        bold: true
        italic: true

    - text: 'alfred and gertrude '
      style:
        bold: true
        underline: true
    
    - text: 'caterpillar, elephant, and iguana '
