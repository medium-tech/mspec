lingo:
    spec: 'text'
    version: '0.1.0b'

block:
    - heading: 'Text Formatting'
      level: 1

    - heading: 'A Few more examples'
      level: 2
    
    - text: 'We can do links: '

    - link: 'https://www.wikipedia.org'
      text: 'Wikipedia'

    - text: ' or as the raw url: '
    - link: 'https://www.wikipedia.org'

    - text: '. Or basic lists of strings (shown as a bulleted list):'
    - type: 'list'
      value:
        - "this is a string in a list"
        - "another hardcoded string in a list"
        - "and finally, a third string in a list"

    - text: 'A struct displays as a 2 column table of its fields and values converted to strings:'
    - type: 'struct'
      value:
        x_bool: true
        x_int: 42
        x_float: 3.14
        x_string: "hello.world"
