lingo:
    spec: 'text'
    version: '0.1.0b'

block:
    - heading: 'Text Formatting'
      level: 1

    - heading: 'A Few more examples'
      level: 2
    
    - text: 'We can do links: '

    - link: 'https://www.wikipedia.org'
      text: 'Wikipedia'

    - text: ' or as the raw url: '
    - link: 'https://www.wikipedia.org'

    - text: '. And basic lists:'
    - type: 'list'
      value:
        - "apples are a fruit"
        - "potatoes are a vegetable"
        - "bison is a mammal"

    - text: 'A struct displays as a 2 column table of its fields and values:'
    - type: 'struct'
      value:
        boolean: true
        integer: 42
        float: 3.14
        string: "hello"
