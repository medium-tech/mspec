lingo:
    spec: 'app'
    version: '0.1.0b'

meta:
    description: 'Hello world for a backend application'

imports:
    - '../lib/hello-library.yaml'

modules:

    my_app:

        ops:
            say_hello: 'hello_ns.say_hello'

            say_goodbye:
                description: 'Say goodbye to a person.'
                args:
                    name:
                        type: str
                        description: 'The name to bid farewell.'
                        default: 'World'

                return:
                    type: str
                    description: 'A farewell message.'

                func:
                    concat:
                        - 'Goodbye, '
                        - args: name
                        - '! See you next time in the world of Lingo.'

            echo_types:
                description: 'Echo primitive operation parameters as text.'
                args:
                    enabled:
                        type: bool
                    count:
                        type: int
                    ratio:
                        type: float
                    label:
                        type: str

                return:
                    type: str

                func:
                    concat:
                        - str: {args: enabled}
                        - '|'
                        - str: {args: count}
                        - '|'
                        - str: {args: ratio}
                        - '|'
                        - args: label

            secure_test:
                description: 'Test secure input and outputs'
                args:
                    name:
                        type: str
                        secure: true

                return:
                    type: struct
                    fields:
                        name:
                            define: str
                        token:
                            define: str
                            secure: true

                func:
                    type: struct
                    value:
                        name: 'Ada'
                        token: 'private-token'

        models:
            person:
                model: 'hello_ns.person'

            post:
                define: struct
                fields:
                    title:
                        define: str
                    message:
                        define: int